name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Fuzz for a minute
        run: go test -run '^$' -fuzz FuzzYAMLToJSON -fuzztime 60s -parallel 1 .
      - name: Fuzz the round trip for a minute
        run: go test -run '^$' -fuzz FuzzRoundTrip -fuzztime 60s -parallel 1 .
      - name: Benchmarks run
        run: go test -run '^$' -bench . -benchtime 1x .
