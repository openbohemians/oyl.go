x-defaults: &defaults
  restart: always
  logging: &logging
    driver: json-file
    options: {max-size: 10m}
  environment:
    TZ: UTC
services:
  web:
    <<: *defaults
    image: web:1
    environment:
      TZ: Europe/Berlin
  worker:
    image: worker:1
    restart: on-failure
    <<: *defaults
  cron:
    <<: [*defaults, {schedule: "*/5 * * * *"}]
    logging: *logging
